<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Seul Choix Point Lighthouse</title>
  
  <link href="Style.css" rel="stylesheet" type="text/css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .login-form {
      max-width: 400px;
      margin: 4rem auto;
      padding: 2rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: var(--border-radius);
    }
    .btn-login {
      width: 100%;
      padding: 0.75rem;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .btn-login:hover {
      background: var(--nav-hover);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="index.html" class="logo-container">
        <img src="logo-official.png" alt="Seul Choix Lighthouse Logo" onerror="this.src='wheel.gif'" / class="">
        <span class="logo-text" style="display:none">Seul Choix Point Lighthouse</span>
      </a>
    </div>
  </header>

  <main class="container">
    <div class="card login-form text-center">
      <h2>Admin Login</h2>
      <p class="mb-3">Please enter your credentials</p>
      
      <form action="/log_in.html" method="POST">
        <div class="form-group">
          <label for="name">Username</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="form-group">
          <label for="pass">Password</label>
          <input type="password" id="pass" name="pass" required />
        </div>
        <button type="submit" class="btn-login">Log In</button>
      </form>
      
      <p class="mt-3"><a href="index.html" style="font-size: 0.9rem;">&larr; Back to Home</a></p>
    </div>
  </main>

  <footer>
    <div class="footer-bottom">
      <p>&copy; <span id="currentYear"></span> Seul Choix Point Lighthouse. All rights reserved.</p>
    </div>
  </footer>

  <script>
    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
